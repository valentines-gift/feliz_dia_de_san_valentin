<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentin Gift</title>
    <link rel="stylesheet" href="cat.css">
</head>
<body>
    <div class="container">
        <!-- Gato -->
        <div class="cat">
            <!-- Nube de diálogo -->
            <div class="cloud">
                <span>Miau</span>
            </div>
            <!-- Orejas -->
            <div class="ear left-ear"></div>
            <div class="ear right-ear"></div>
            <!-- Cara -->
            <div class="face">
                <div class="eye left-eye">
                    <div class="pupil"></div>
                </div>
                <div class="eye right-eye">
                    <div class="pupil"></div>
                </div>
                <div class="nose"></div>
                <div class="mouth"></div>
                <!-- Bigotes -->
                <div class="whiskers left-whiskers top"></div>
                <div class="whiskers right-whiskers top"></div>
                <div class="whiskers left-whiskers bottom"></div>
                <div class="whiskers right-whiskers bottom"></div>
            </div>
            <!-- Cuerpo -->
            <div class="body"></div>
            <!-- Cola -->
            <div class="tail"></div>
        </div>
        <h1>Jesus tiene un regalo para ti (●'◡'●)</h1>
        <a href="flowers.html"><button id="acceptButton">Aceptarlo</button></a>
    </div>
    <script src="cat.js"></script>
</body>
</html>
